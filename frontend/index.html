<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --sidebar: #1e293b;
      --chat-bg: #0b1120;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --user-bubble: #2563eb;
      --ai-bubble: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 280px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h2 { font-size: 1.1rem; }

    .btn-new {
      background: var(--primary);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    #thread-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 12px;
    }

    .thread-item {
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      background: transparent;
      transition: background 0.15s;
    }

    .thread-item:hover, .thread-item.active { background: #334155; }
    .thread-title {
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 190px;
    }

    .btn-del {
      background: transparent;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 2px 6px;
    }

    /* Main Chat Area */
    #main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--chat-bg);
      position: relative;
    }

    .top-bar {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--sidebar);
    }

    .tone-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
    }

    select {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      outline: none;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .bubble.assistant {
      align-self: flex-start;
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 2px;
    }

    .meta-tag {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 6px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .copy-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.72rem;
    }

    .copy-btn:hover { color: #fff; }

    /* Input Footer */
    .input-bar {
      padding: 16px 20px;
      background: var(--sidebar);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      height: 48px;
      outline: none;
    }

    button#btn-send {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
    }

    button#btn-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Sidebar: History & Threads -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h2>Conversations</h2>
      <button class="btn-new" onclick="startNewChat()">+ New</button>
    </div>
    <ul id="thread-list"></ul>
  </aside>

  <!-- Main View -->
  <main id="main-chat">
    <div class="top-bar">
      <div><strong>AI Assistant</strong></div>
      <div class="tone-selector">
        <label for="tone-select">Tone:</label>
        <select id="tone-select">
          <option value="Professional">Professional</option>
          <option value="Casual">Casual</option>
          <option value="Concise">Concise</option>
        </select>
      </div>
    </div>

    <!-- Scrollable Chat Area -->
    <div id="messages"></div>

    <!-- Input Box -->
    <form class="input-bar" onsubmit="sendMessage(event)">
      <textarea id="prompt-input" placeholder="Type a message... (Press Enter to send)" onkeydown="handleEnter(event)"></textarea>
      <button type="submit" id="btn-send">Send</button>
    </form>
  </main>

  <script>
    const API_BASE = "http://localhost:8000/api";
    let currentThreadId = null;

    window.addEventListener("DOMContentLoaded", () => {
      loadThreads();
    });

    async function loadThreads() {
      try {
        const res = await fetch(`${API_BASE}/threads`);
        const data = await res.json();
        const list = document.getElementById("thread-list");
        list.innerHTML = "";
        data.threads.forEach(t => {
          const li = document.createElement("li");
          li.className = `thread-item ${t.thread_id === currentThreadId ? 'active' : ''}`;
          li.innerHTML = `
            <span class="thread-title" onclick="switchThread('${t.thread_id}')">${escapeHtml(t.title || 'New Thread')}</span>
            <button class="btn-del" onclick="deleteThread('${t.thread_id}')">✕</button>
          `;
          list.appendChild(li);
        });
      } catch (err) {
        console.error("Failed to load threads:", err);
      }
    }

    async function switchThread(threadId) {
      currentThreadId = threadId;
      loadThreads();
      const messagesContainer = document.getElementById("messages");
      messagesContainer.innerHTML = "";

      try {
        const res = await fetch(`${API_BASE}/threads/${threadId}/messages`);
        const data = await res.json();
        data.messages.forEach(msg => {
          appendBubble(msg.role, msg.content, msg.latency_ms);
        });
      } catch (err) {
        console.error("Failed to load messages:", err);
      }
    }

    function startNewChat() {
      currentThreadId = null;
      document.getElementById("messages").innerHTML = "";
      loadThreads();
    }

    async function deleteThread(threadId) {
      if (!confirm("Delete this conversation?")) return;
      try {
        await fetch(`${API_BASE}/threads/${threadId}`, { method: "DELETE" });
        if (currentThreadId === threadId) startNewChat();
        else loadThreads();
      } catch (err) {
        console.error("Failed to delete thread:", err);
      }
    }

    function appendBubble(role, content = "", latency = null) {
      const messages = document.getElementById("messages");
      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;
      bubble.innerText = content;

      if (role === "assistant" && content) {
        addBubbleFooter(bubble, content, latency);
      }

      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    function addBubbleFooter(bubble, text, latency) {
      const footer = document.createElement("div");
      footer.className = "meta-tag";
      
      let metaContent = "";
      if (latency) metaContent += `<span>${latency}ms</span>`;
      metaContent += `<button class="copy-btn" onclick="copyText('${escapeQuotes(text)}')">Copy</button>`;
      
      footer.innerHTML = metaContent;
      bubble.appendChild(footer);
    }

    async function sendMessage(e) {
      if (e) e.preventDefault();
      const input = document.getElementById("prompt-input");
      const text = input.value.trim();
      const tone = document.getElementById("tone-select").value;
      if (!text) return;

      appendBubble("user", text);
      input.value = "";

      const sendBtn = document.getElementById("btn-send");
      sendBtn.disabled = true;

      // Create an empty AI bubble ready for streaming
      const aiBubble = appendBubble("assistant", "");
      let fullText = "";

      try {
        const response = await fetch(`${API_BASE}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            thread_id: currentThreadId,
            prompt: text,
            tone: tone
          })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n\n");
          buffer = lines.pop(); // keep remainder

          for (const line of lines) {
            if (line.startsWith("data: ")) {
              const data = JSON.parse(line.replace("data: ", ""));
              
              if (data.type === "init") {
                if (!currentThreadId) {
                  currentThreadId = data.thread_id;
                  loadThreads();
                }
              } else if (data.type === "chunk") {
                fullText += data.text;
                aiBubble.innerText = fullText;
                document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
              } else if (data.type === "done") {
                addBubbleFooter(aiBubble, fullText, data.latency_ms);
              }
            }
          }
        }
      } catch (err) {
        aiBubble.innerText = "Error: Could not retrieve response.";
      } finally {
        sendBtn.disabled = false;
      }
    }

    function handleEnter(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function copyText(str) {
      navigator.clipboard.writeText(str);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/\n/g, "\\n");
    }
  </script>
</body>
</html>
